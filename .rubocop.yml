AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "pkg/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
  Exclude:
    - "test/**/*"

Metrics/BlockLength:
  Exclude:
    - "*.gemspec"
    - "Rakefile"
    - "test/**/*"

Metrics/ClassLength:
  Max: 150

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 20

Metrics/ParameterLists:
  CountKeywordArgs: false


# The gem entry point must match the gem name, which contains hyphens.
Naming/FileName:
  Exclude:
    - "lib/typesafe-ai-ruby.rb"

# Tests write criteria the way users would, with true/false keys.
Lint/BooleanSymbol:
  Exclude:
    - "test/**/*"

# Examples print aligned columns with format; annotated tokens would only add noise there.
Style/FormatStringToken:
  Exclude:
    - "examples/**/*"
